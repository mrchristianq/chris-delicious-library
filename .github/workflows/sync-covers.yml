name: Sync New Covers

on:
  # Run manually from Actions tab
  workflow_dispatch:
  
  # Or run on schedule (once per day at 2 AM UTC)
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Sync new covers from Google Sheets
        env:
          NEXT_PUBLIC_TV_SHEET_CSV_URL: ${{ secrets.NEXT_PUBLIC_TV_SHEET_CSV_URL }}
          NEXT_PUBLIC_BOOKS_SHEET_CSV_URL: ${{ secrets.NEXT_PUBLIC_BOOKS_SHEET_CSV_URL }}
          NEXT_PUBLIC_MOVIES_SHEET_CSV_URL: ${{ secrets.NEXT_PUBLIC_MOVIES_SHEET_CSV_URL }}
          NEXT_PUBLIC_GAMES_SHEET_CSV_URL: ${{ secrets.NEXT_PUBLIC_GAMES_SHEET_CSV_URL }}
        run: npm run sync-covers
      
      - name: Check for new covers
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain public/covers/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Add new cover images from Google Sheets sync"
          title: "🖼️ New Covers Sync"
          body: |
            ## New Covers Added
            
            This PR adds new cover images that were found in your Google Sheets.
            
            ### What's included:
            - New cover images in `/public/covers/`
            - Updated manifest in `/public/covers-manifest.json`
            - CSV files with GitHub URLs in `/github-urls-output/`
            
            ### Next steps:
            1. Review the new covers in the Files Changed tab
            2. Import the CSVs from `github-urls-output/` to update your Google Sheets
            3. Merge this PR to deploy the covers
            
            ---
            *Auto-generated by cover sync workflow*
          branch: sync-new-covers
          branch-suffix: timestamp
          delete-branch: true
